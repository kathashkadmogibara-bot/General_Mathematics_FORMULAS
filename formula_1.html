<body>

  <header>
       <h2>(a+b)<sup>2</sup></h2>
  </header>

  <main>
     <section>
       <h3>MAIN ANSWER</h3>
         <p> (a+b)<sup>2</sup></p>
      <br>
         <p>=a<sup>2</sup>2ab+b<sup>2</sup></p>
     </section>

     <section>
       <h3>PROVE</h3>
         <p> (a+b)<sup>2</sup></p>
      <br>
        <p>=(a+b)(a+b)</p>
      <br>
        <p>=a(a+b)+b(a+b)</p>
      <br>
        <p>=a<sup>2</sup>2ab+b<sup>2</sup></p>
      <br>
        <p>PROVED</p>
     </section>
    
  </main>

<!DOCTYPE html>

<head>

    <title>(x-a)(x-b) - MOGIBARA</title>

    <link rel="stylesheet" href="formulas.css">
</head>

<body>

<header>
    <h2>(x-a)(x-b)</h2>
</header>

<main>

<section>
    <h3>MAIN ANSWER</h3>
    <p>(x-a)(x-b)</p>
    <br>
    <p>=x²-(a+b)x+ab</p>
</section>

<section>
    <h3>PROVE</h3>

    <p>(x-a)(x-b)</p>
    <br>

    <p>=x(x-b)-a(x-b)</p>
    <br>

    <p>=x²-xb-ax+ab</p>
    <br>

    <p>=x²-(a+b)x+ab</p>
    <br>

    <p>PROVED</p>
</section>

</main>

</body>
</html>

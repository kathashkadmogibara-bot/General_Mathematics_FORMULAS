    <title>a³-b³ - MOGIBARA</title>

<body>

<header>
    <h2>a³-b³</h2>
</header>

<main>

<section>
    <h3>MAIN ANSWER</h3>

    <p>a³-b³</p>
    <br>

    <p>=(a-b)(a²+ab+b²)</p>
</section>

<section>
    <h3>PROVE</h3>

    <p>(a-b)(a²+ab+b²)</p>
    <br>

    <p>=a(a²+ab+b²)-b(a²+ab+b²)</p>
    <br>

    <p>=a³+a²b+ab²-a²b-ab²-b³</p>
    <br>

    <p>=a³-b³</p>
    <br>

    <p>PROVED</p>
</section>

</main>

</body>

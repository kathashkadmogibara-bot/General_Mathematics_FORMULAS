    <title>(a-b)² - MOGIBARA</title>

    <link rel="stylesheet" href="formulas.css">
</head>

<body>

<header>
    <h2>(a-b)²</h2>
</header>

<main>

<section>
    <h3>MAIN ANSWER</h3>
    <p>(a-b)²</p>
    <br>
    <p>= a² - 2ab + b²</p>
</section>

<section>
    <h3>PROVE</h3>

    <p>(a-b)²</p>
    <br>

    <p>=(a-b)(a-b)</p>
    <br>

    <p>=a(a-b)-b(a-b)</p>
    <br>

    <p>=a²-ab-ab+b²</p>
    <br>

    <p>=a²-2ab+b²</p>
    <br>

    <p>PROVED</p>
</section>

</main>

</body>
